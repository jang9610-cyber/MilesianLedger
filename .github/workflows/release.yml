name: Release Windows beta

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Build, verify and publish
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        # The desktop scripts load .NET Framework assemblies using Windows PowerShell.
        shell: powershell

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          . ./scripts/common.ps1
          $version = Get-LedgerVersion (Get-Location).Path
          if ($env:RELEASE_TAG -ne ('v' + $version)) { throw 'Tag and app version do not match.' }
          if (-not (Test-Path ('docs/releases/' + $env:RELEASE_TAG + '.md'))) { throw 'Release notes are missing.' }

      - name: Test desktop core
        # UI and focus tests need an interactive desktop and are run locally.
        run: ./scripts/test.ps1

      - name: Test shared snapshot download and auction integration
        run: ./scripts/test-market-snapshot.ps1

      - name: Test Node proxy with mock upstream
        run: node --test "server/test/*.test.mjs"

      - name: Test Cloudflare Worker with mock bindings and upstream
        run: node --test "server/cloudflare/*.test.mjs"

      - name: Check proxy item allowlists
        run: ./scripts/update-proxy-items.ps1 -Check

      - name: Build distributable ZIP and checksum
        run: ./scripts/package.ps1

      - name: Publish this runner's verified ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/publish-release.ps1
