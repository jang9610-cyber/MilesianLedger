name: Verify and package

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows build and offline tests
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        # The desktop scripts load .NET Framework assemblies using Windows PowerShell.
        shell: powershell

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test desktop core
        # UI and focus tests need an interactive desktop and are run locally.
        run: ./scripts/test.ps1

      - name: Test Node proxy with mock upstream
        run: node --test "server/test/*.test.mjs"

      - name: Test Cloudflare Worker with mock bindings and upstream
        run: node --test server/cloudflare/worker.test.mjs server/cloudflare/market.test.mjs

      - name: Check proxy item allowlists
        run: ./scripts/update-proxy-items.ps1 -Check

      - name: Build distributable ZIP and checksum
        run: ./scripts/package.ps1

      # Workflow artifacts are verification outputs. This does not publish a release.
      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MilesianLedger-windows-${{ github.sha }}
          path: |
            dist/MilesianLedger-v*.zip
            dist/MilesianLedger-v*.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
